services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: llm_benchmark
      POSTGRES_USER: llm_benchmark
      POSTGRES_PASSWORD: llm_benchmark_dev
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U llm_benchmark -d llm_benchmark
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-benchmark-poc:local
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - python
      - -m
      - alembic
      - upgrade
      - head
    environment:
      LLM_BENCHMARK_DATABASE_URL: postgresql+psycopg://llm_benchmark:llm_benchmark_dev@postgres:5432/llm_benchmark

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-benchmark-poc:local
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      - python
      - -m
      - uvicorn
      - llm_benchmark.api:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      LLM_BENCHMARK_DATABASE_URL: postgresql+psycopg://llm_benchmark:llm_benchmark_dev@postgres:5432/llm_benchmark
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - benchmark_runtime:/app/runtime
      - benchmark_outputs:/app/outputs

  worker:
    image: llm-benchmark-poc:local
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      - python
      - -m
      - llm_benchmark.worker
    environment:
      LLM_BENCHMARK_DATABASE_URL: postgresql+psycopg://llm_benchmark:llm_benchmark_dev@postgres:5432/llm_benchmark
    volumes:
      - benchmark_runtime:/app/runtime
      - benchmark_outputs:/app/outputs

volumes:
  postgres_data:
  benchmark_runtime:
  benchmark_outputs:
