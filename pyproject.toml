[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "llm-benchmark-poc"
version = "0.1.0"
description = "Reproducible multiple-choice LLM benchmark POC"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.13,<2",
  "fastapi>=0.115,<0.120",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "SQLAlchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
huggingface = ["datasets>=3.0,<5"]
dev = [
 "httpx>=0.27,<1",
 "pytest>=8.2,<9",
 "ruff>=0.16, <0.17",]

[project.scripts]
llm-benchmark = "llm_benchmark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_benchmark"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = ["network: requires network access and Hugging Face"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["I001"]
"tests/conftest.py" = ["E402", "I001"]